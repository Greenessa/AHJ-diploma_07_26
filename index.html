<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="X-UA-Compatible" content="ie=edge"><title>Chaos Organizer</title><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="app"><aside class="sidebar"><div class="sidebar__header"><div class="profile"><div class="profile__avatar">C</div><div><h1 class="profile__title">Chaos Organizer</h1><p class="profile__subtitle">бот-органайзер</p></div></div></div><div class="sidebar__search"><input class="sidebar__search-input" placeholder="Поиск сообщений"></div><nav class="sidebar__menu"><button class="sidebar__button chat-button active">Чат</button> <button class="sidebar__button favorite">Избранное</button> <button class="sidebar__button">Изображения</button> <button class="sidebar__button">Видео</button> <button class="sidebar__button">Аудио</button> <button class="sidebar__button">Файлы</button></nav></aside><main class="chat"><header class="chat__header"><div class="chat__info"><div class="chat__avatar">🤖</div><div><h2 class="chat__title">Chaos Bot</h2><p class="chat__status">онлайн</p></div></div></header><section class="pinned-message"><span class="pinned-message__label">Закреплено: </span><span class="pinned-message__text">Здесь будет закреплённое сообщение</span></section><section class="messages"><button class="messages__load-more" type="button">Загрузить предыдущие сообщения</button></section><form class="message-form"><label class="message-form__file">📎 <input class="message-form__file-input" type="file" multiple="multiple" hidden></label> <textarea class="message-form__input" placeholder="Введите сообщение"></textarea> <button class="message-form__send" type="submit">➤</button></form></main></div></body></html>
